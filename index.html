<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name=theme-color content="#000"><meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes>
<link rel=manifest href=manifest.webmanifest><link rel=apple-touch-icon href=icon-192.png><title>GPS Speedo</title>
<style>
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%;background:#000;color:#fff;font:16px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.g{background:rgba(10,10,14,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#mp{position:relative;flex:1;min-height:0;min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#nav{position:absolute;left:8px;right:8px;top:8px;border-radius:16px;padding:8px 14px;display:flex;gap:14px;align-items:center}
#ar{width:min(64px,14vh);height:min(64px,14vh);flex:none;transition:transform .3s}

#lp{order:2;padding:8px 14px calc(8px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}
#t0{display:flex;gap:8px;margin-bottom:6px}
#t0 button{width:46px;height:46px;border:0;border-radius:12px;background:#2b2f3a;color:#fff;font-size:22px}
#row{display:flex;align-items:flex-end;gap:14px}
#sp{font-size:min(88px,19vh);font-weight:800;line-height:.95;font-variant-numeric:tabular-nums}#un{opacity:.6}
#st{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;flex:1;font-size:11px;letter-spacing:.05em}
#st b{display:block;font-size:min(19px,5vh);letter-spacing:0}
#bt{display:flex;gap:10px;margin-top:10px}
#bt button{flex:1;padding:min(14px,3vh);border:0;border-radius:14px;font-size:18px;font-weight:800}
#go{background:#19c37d}#stop{background:#ff4d4d;color:#fff}
@media (orientation:landscape){body{flex-direction:row;padding-left:env(safe-area-inset-left)}#lp{order:0;width:clamp(250px,38vw,360px);flex:none;height:100%}#row{flex-direction:column;align-items:stretch;gap:4px}#st{grid-template-columns:repeat(3,1fr)}}
#sh,#mn{position:fixed;inset:6% 0 0;transform:translateY(105%);transition:.25s;padding:16px;border-radius:22px 22px 0 0;overflow:auto;touch-action:pan-y;z-index:5}
#sh.o,#mn.o{transform:none}
h3{display:flex;justify-content:space-between;margin-bottom:10px}h3 button{background:none;border:0;color:#fff;font-size:22px}
#mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
#mg button{padding:16px;border:0;border-radius:14px;background:#2b2f3a;color:#fff;font-size:16px;text-align:left}
.tr{padding:12px 0;border-top:1px solid #333;font-size:14px}.tr span{display:block;opacity:.7;margin:4px 0 8px}
.tr button{margin-right:6px;padding:8px 12px;border:0;border-radius:10px;background:#2b2f3a;color:#fff}
#ts{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9;text-align:center}
body.sv #map{display:none}body.sv .g{background:#000}
</style></head><body>
<div id=lp class=g>
<div id=t0><button id=mb title=Menu>☰</button><button id=rc title="Recenter / heading-up">◎</button><button id=bs title="Battery saver">🔋</button></div>
<div id=row><div><div id=sp>0</div><div id=un>km/h</div></div>
<div id=st><div>AVG<b id=av>0</b></div><div>MAX<b id=mx>0</b></div><div>DIST<b id=di>0</b></div><div>TIME<b id=tm>0:00:00</b></div><div>CLIMB<b id=cb>0 m</b></div><div>MOVING<b id=mv>0:00:00</b></div><div>ALT<b id=al>–</b></div><div>GPS<b id=ac>–</b></div></div></div>
<div id=bt><button id=go>START</button><button id=stop hidden>STOP</button></div></div>
<div id=mp><canvas id=map></canvas>
<div id=nav class=g hidden><svg id=ar viewBox="0 0 24 24"><path d="M12 2l8 9h-5v11H9V11H4z" fill="#fff"/></svg><div><div id=nd></div><div id=nt></div><div id=nx></div></div></div></div>
<input type=file id=f accept=".gpx,.kml,.xml" hidden>
<div id=mn class=g><h3><span>Menu</span><button id=mx2>✕</button></h3><div id=mg>
<button id=im>📂 Import route file (GPX / KML)</button>
<button id=gl>🔗 Import Google Maps link</button>
<button id=dr>🧭 Directions list</button>
<button id=tb>📋 Trips &amp; history</button>
<button id=sv>🟧 Send latest trip to Strava</button>
<button id=lb>🏷 Street labels</button>
<button id=mu>📏 Units</button>
<button id=pr>🗂 Past routes</button>
<button id=ed>✏️ Move/add stops</button>
<button id=ap>⏸ Auto-pause</button>
</div></div>
<div id=sh class=g><h3><span id=sht>Trips</span><button id=cl>✕</button></h3><div id=tl></div></div>
<div id=ts></div>
<script>
const $=id=>document.getElementById(id),R=Math.PI/180,cl=(z)=>Math.max(2,Math.min(19,z));
let S={st:0,pts:[],dist:0,mov:0,max:0,gain:0,el:0,t0:0,tk:Date.now(),unit:+localStorage.u||0},cur=null,route=null,mans=[],cum=[],ri=0,view=null,follow=true,C={lat:20,lon:0,z:2},dirty=1,W,H,pv=null,lg=null,first=1,rot=0,hu=0,zu=0,lab=localStorage.l!='0',wps=[],edm=0,apm=+localStorage.ap||0,sv=0,ba=null,idleT=0,dg=null,lpT=0,mv0=[0,0],moved=0,rid=0;
// ---------- helpers
const hav=(a,b)=>{const p=(b[0]-a[0])*R,l=(b[1]-a[1])*R,x=Math.sin(p/2)**2+Math.cos(a[0]*R)*Math.cos(b[0]*R)*Math.sin(l/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const brg=(a,b)=>{const L=(b[1]-a[1])*R,y=Math.sin(L)*Math.cos(b[0]*R),x=Math.cos(a[0]*R)*Math.sin(b[0]*R)-Math.sin(a[0]*R)*Math.cos(b[0]*R)*Math.cos(L);return(Math.atan2(y,x)/R+360)%360};
const fd=m=>m<1000?(m<100?Math.round(m/5)*5:Math.round(m/10)*10)+' m':(m/1000).toFixed(m<10000?1:0)+' km';
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fm=x=>x>=3600?(x/3600|0)+'h '+Math.round(x%3600/60)+'m':Math.max(1,Math.round(x/60))+' min';
const dk=m=>S.unit?(m/1609.34).toFixed(2)+' mi':(m/1000).toFixed(2)+' km';
const ft=s=>{s=Math.floor(s);return[s/3600|0,(s/60|0)%60,s%60].map((x,i)=>i?String(x).padStart(2,'0'):x).join(':')};
const toast=m=>{const e=$('ts');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,3000)};
// ---------- storage (IndexedDB)
const dbp=new Promise(r=>{const q=indexedDB.open('spd',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const kv=async(m,f)=>{const d=await dbp;return new Promise(r=>{const q=f(d.transaction('k',m=='r'?'readonly':'readwrite').objectStore('k'));q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
// ---------- satellite map (own canvas renderer, tiles cached offline by service worker)
const cv=$('map'),cx=cv.getContext('2d'),T=new Map();
const rs=()=>{const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);dirty=1};
const wp=(lat,lon,z)=>{const n=256*2**z,s=Math.sin(lat*R);return[(lon+180)/360*n,(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n]};
const ll=(x,y,z)=>{const n=256*2**z;return[Math.atan(Math.sinh(Math.PI*(1-2*y/n)))/R,x/n*360-180]};
const SV=['World_Imagery','Reference/World_Transportation','Reference/World_Boundaries_and_Places'];
const tu=(L,z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/${SV[L]}/MapServer/tile/${z}/${y}/${x}`;
const tile=(L,z,x,y)=>{const k=`${L}/${z}/${x}/${y}`;let i=T.get(k);if(!i){i=new Image();i.crossOrigin='anonymous';i.onload=()=>{i.ok=1;dirty=1};i.src=tu(L,z,x,y);T.set(k,i);if(T.size>900)T.delete(T.keys().next().value)}return i};
const draw=()=>{dirty=0;cx.fillStyle='#111';cx.fillRect(0,0,W,H);
const tz=Math.round(cl(C.z)),sc=2**(C.z-tz),[ox,oy]=wp(C.lat,C.lon,tz),n=2**tz,ts=256*sc,cy=hu?H*.6:H/2,big=rot||hu,hw=big?Math.hypot(W,H):W/2,hh=big?hw:H/2;
cx.save();cx.translate(W/2,cy);cx.rotate(-rot*R);cx.translate(-W/2,-cy);
const x0=Math.floor((ox-hw/sc)/256),x1=Math.floor((ox+hw/sc)/256),y0=Math.max(0,Math.floor((oy-hh/sc)/256)),y1=Math.min(n-1,Math.floor((oy+hh/sc)/256));
for(let L=0;L<(lab&&!hu?3:1);L++)for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const xx=((x%n)+n)%n,i=tile(L,tz,xx,y),dx=(x*256-ox)*sc+W/2,dy=(y*256-oy)*sc+cy;
if(i.ok)cx.drawImage(i,dx,dy,ts+.5,ts+.5);else if(!L)for(let d=1;d<=3&&tz-d>=0;d++){const p=T.get(`0/${tz-d}/${xx>>d}/${y>>d}`);if(p&&p.ok){const s=256/2**d,m=2**d-1;cx.drawImage(p,(xx&m)*s,(y&m)*s,s,s,dx,dy,ts+.5,ts+.5);break}}}
const P=a=>{const[px,py]=wp(a[0],a[1],tz);return[(px-ox)*sc+W/2,(py-oy)*sc+cy]};
const ln=(pts,col,w)=>{if(!pts||pts.length<2)return;cx.beginPath();pts.forEach((a,i)=>{const[x,y]=P(a);i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.strokeStyle=col;cx.lineWidth=w;cx.lineJoin=cx.lineCap='round';cx.stroke()};
ln(route,'#00e5ff',6);ln(view,'#ff4df0',5);ln(S.pts,'#ffd400',5);
wps.forEach(w=>{const[x,y]=P(w.p);cx.save();cx.translate(x,y);cx.rotate(rot*R);cx.beginPath();cx.arc(0,0,9,0,7);cx.fillStyle=/start|finish/i.test(w.n)?'#19c37d':'#ff9500';cx.fill();cx.lineWidth=3;cx.strokeStyle='#fff';cx.stroke();cx.font='bold 14px system-ui';cx.lineWidth=4;cx.strokeStyle='#000';cx.strokeText(w.n,14,5);cx.fillStyle='#fff';cx.fillText(w.n,14,5);cx.restore()});
if(cur){const[x,y]=P(cur.p);cx.save();cx.translate(x,y);cx.rotate(cur.h*R);cx.fillStyle='#2b8cff';cx.strokeStyle='#fff';cx.lineWidth=3;cx.beginPath();cx.moveTo(0,-16);cx.lineTo(11,12);cx.lineTo(0,6);cx.lineTo(-11,12);cx.closePath();cx.fill();cx.stroke();cx.restore()}
cx.restore()};
const loop=()=>{dirty&&!sv&&draw();requestAnimationFrame(loop)};
const pan=(dx,dy)=>{const r=rot*R,c=Math.cos(r),q=Math.sin(r),[ox,oy]=wp(C.lat,C.lon,C.z);[C.lat,C.lon]=ll(ox-(dx*c-dy*q),oy-(dx*q+dy*c),C.z)};
const ptr=new Map();
const scr=a=>{const[px,py]=wp(a[0],a[1],C.z),[ox,oy]=wp(C.lat,C.lon,C.z),q=rot*R,wx=px-ox,wy=py-oy;return[wx*Math.cos(q)+wy*Math.sin(q)+W/2,-wx*Math.sin(q)+wy*Math.cos(q)+(hu?H*.6:H/2)]};
const s2l=(x,y)=>{const q=rot*R,dx=x-W/2,dy=y-(hu?H*.6:H/2),[ox,oy]=wp(C.lat,C.lon,C.z);return ll(ox+dx*Math.cos(q)-dy*Math.sin(q),oy+dx*Math.sin(q)+dy*Math.cos(q),C.z)};
const sxy=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);dg=null;moved=0;clearTimeout(lpT);
if(edm&&ptr.size==1){const[x,y]=sxy(e);mv0=[x,y];dg=wps.find(w=>{const q=scr(w.p);return Math.hypot(q[0]-x,q[1]-y)<26})||null;
lpT=setTimeout(()=>{if(moved)return;const w=dg;dg=null;ptr.clear();
if(w){const n=prompt('Rename stop (leave empty to delete)',w.n);if(n===null)return;if(n.trim())w.n=n.trim();else wps.splice(wps.indexOf(w),1)}
else{const n=prompt('Name this new stop','Rest stop');if(!n||!n.trim())return;wps.push({p:s2l(x,y),n:n.trim()})}
snapW();upd();dirty=1},600)}};
cv.onpointermove=e=>{const o=ptr.get(e.pointerId);if(!o)return;const nw=[e.clientX,e.clientY];
if(edm&&ptr.size==1){const[x,y]=sxy(e);if(Math.hypot(x-mv0[0],y-mv0[1])>8){moved=1;clearTimeout(lpT)}if(!moved)return;if(dg){dg.p=s2l(x,y);ptr.set(e.pointerId,nw);dirty=1;return}}
if(ptr.size==1){pan(nw[0]-o[0],nw[1]-o[1]);follow=false}
else{const q=[...ptr].find(([k])=>k!=e.pointerId)[1],d0=Math.hypot(o[0]-q[0],o[1]-q[1]),d1=Math.hypot(nw[0]-q[0],nw[1]-q[1]);if(d0){C.z=cl(C.z+Math.log2(d1/d0));zu=1}}
ptr.set(e.pointerId,nw);dirty=1};
cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);clearTimeout(lpT);if(dg&&moved){snapW();upd();dirty=1}dg=null};
cv.onwheel=e=>{e.preventDefault();C.z=cl(C.z-e.deltaY/300);zu=1;dirty=1};
const fit=pts=>{let a=[90,-90],b=[180,-180];pts.forEach(p=>{a=[Math.min(a[0],p[0]),Math.max(a[1],p[0])];b=[Math.min(b[0],p[1]),Math.max(b[1],p[1])]});
C.lat=(a[0]+a[1])/2;C.lon=(b[0]+b[1])/2;let z=18;for(;z>3;z--){const p=wp(a[1],b[0],z),q=wp(a[0],b[1],z);if(q[0]-p[0]<W*.8&&q[1]-p[1]<H*.45)break}C.z=z;follow=false;rot=0;hu=0;dirty=1};
// ---------- GPS
let wl;const wake=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
document.onvisibilitychange=()=>{if(!document.hidden&&S.st==1)wake()};
const onPos=p=>{const c=p.coords;if(c.accuracy>60)return;const t=p.timestamp,a=[c.latitude,c.longitude,t,c.altitude];
let v=c.speed;if(v==null&&pv)v=hav(pv,a)/Math.max(.5,(t-pv[2])/1e3);v=v>.6?v:0;
const h=(c.heading!=null&&!isNaN(c.heading)&&v)?c.heading:(pv&&v&&hav(pv,a)>3?brg(pv,a):(cur?cur.h:0));
if(!pv||hav(pv,a)>3)pv=a;cur={p:a,v,h,acc:c.accuracy};idleT=v?0:(idleT||t);
if(S.st==1){S.max=Math.max(S.max,v);if(a[3]!=null){if(ba==null)ba=a[3];else if(a[3]-ba>=3){S.gain+=a[3]-ba;ba=a[3]}else if(a[3]<ba-3)ba=a[3]}if(!lg){S.pts.push(a);lg=a}else if(v){const d=hav(lg,a);if(d>=3){S.pts.push(a);S.dist+=d;S.mov+=Math.min(10,(t-lg[2])/1e3);lg=a}}}
if(first){first=0;C.z=17}if(follow){C.lat=a[0];C.lon=a[1];if(hu&&v){rot=(rot+((h-rot+540)%360-180)*.35+360)%360}if(!zu){const g=v>22?15.8:v>12?16.4:v>5?17:17.8;C.z+=(g-C.z)*.2}}
nav();ui();dirty=1};
navigator.geolocation.watchPosition(onPos,e=>toast('Location error: '+e.message),{enableHighAccuracy:true,maximumAge:0,timeout:20000});
// ---------- UI
const autop=()=>S.st==1&&apm&&idleT&&Date.now()-idleT>4000;
const ui=()=>{const k=S.unit?2.23694:3.6,v=cur?cur.v:0;
$('sp').textContent=Math.round(v*k);$('un').textContent=S.unit?'mph':'km/h';
$('av').textContent=S.mov>5?(S.dist/S.mov*k).toFixed(1):0;$('mx').textContent=Math.round(S.max*k);$('di').textContent=dk(S.dist);$('tm').textContent=ft(S.el);
$('cb').textContent=Math.round(S.gain)+' m';$('mv').textContent=ft(S.mov);$('al').textContent=cur&&cur.p[3]!=null?Math.round(cur.p[3])+' m':'–';$('ac').textContent=autop()?'auto-paused':cur?'±'+Math.round(cur.acc)+' m':'no fix';
$('go').textContent=['START','PAUSE','RESUME'][S.st];$('stop').hidden=!S.st;$('mu').textContent='📏 Units: '+(S.unit?'mph / miles':'km/h / km');$('lb').textContent='🏷 Street labels: '+(lab?'on':'off');$('ed').textContent='✏️ Move/add stops: '+(edm?'on':'off');$('ap').textContent='⏸ Auto-pause: '+(apm?'on':'off')};
setInterval(()=>{const n=Date.now();if(S.st==1&&!autop())S.el+=(n-S.tk)/1e3;S.tk=n;ui()},1000);
setInterval(()=>{if(S.st&&S.pts.length>1)kv('w',s=>s.put({id:S.t0,pts:S.pts,dist:S.dist,mov:S.mov,el:S.el,max:S.max,gain:S.gain},'cur'))},15000);
$('sp').onclick=()=>{S.unit^=1;localStorage.u=S.unit;ui()};
$('go').onclick=()=>{S.tk=Date.now();if(!S.st){S.t0=Date.now();S.st=1;wake()}else S.st=S.st==1?2:1;lg=null;ui()};
const stop=async()=>{if(!S.st||!confirm('Stop and save this trip?'))return;const t={id:S.t0,pts:S.pts,dist:S.dist,mov:S.mov,el:S.el,max:S.max,gain:S.gain};S.st=0;
if(t.pts.length>1)await kv('w',s=>s.put(t,'t'+t.id));await kv('w',s=>s.delete('cur'));
S={...S,pts:[],dist:0,mov:0,max:0,gain:0,el:0};lg=null;if(t.pts.length>1){view=t.pts;fit(view);toast('Trip saved ✔ – send it to Strava from ☰ Menu')}ui()};
$('stop').onclick=stop;
$('rc').onclick=()=>{if(follow&&cur){hu^=1;if(!hu)rot=0}else{follow=true;zu=0;view=null}if(cur){C.lat=cur.p[0];C.lon=cur.p[1];if(hu)rot=cur.h}$('rc').textContent=hu?'⬆':'◎';dirty=1};
$('lb').onclick=()=>{lab=!lab;localStorage.l=lab?1:0;dirty=1;ui()};
// ---------- GPX import + turn guidance (computed from route geometry)
const tx=t=>{const a=Math.abs(t),s=t<0?'left':'right';return a>165?'Make a U-turn':(a<60?'Slight ':a>120?'Sharp ':'Turn ')+s};
const snapW=()=>{if(!route)return;wps.forEach(w=>{let b=1e9;route.forEach((q,i)=>{const d=hav(q,w.p);if(d<b){b=d;w.i=i}})});wps.sort((a,b)=>a.i-b.i)};
const setRoute=(pts,ms)=>{let L=pts[0];pts=pts.filter((p,i)=>{if(!i||i==pts.length-1||hav(L,p)>=8){L=p;return 1}});route=pts;cum=[0];for(let i=1;i<pts.length;i++)cum[i]=cum[i-1]+hav(pts[i-1],pts[i]);ri=0;mans=[];snapW();
const at=(i,d)=>{let j=i;while(j+d>=0&&j+d<pts.length&&Math.abs(cum[j]-cum[i])<30)j+=d;return j};
for(let i=1;i<pts.length-1;i++){const a=at(i,-1),b=at(i,1);if(a==i||b==i)continue;const t=((brg(pts[i],pts[b])-brg(pts[a],pts[i])+540)%360)-180;
if(Math.abs(t)>=40){const m=mans[mans.length-1];if(m&&cum[i]-cum[m.i]<50){if(Math.abs(t)>Math.abs(m.t)){m.i=i;m.t=t;m.n=pts[i][4]}}else mans.push({i,t,n:pts[i][4]})}}
if(ms)mans=ms.map(x=>{let b=1e9,i=0;pts.forEach((q,j)=>{const d=hav(q,x.p);if(d<b){b=d;i=j}});return{i,t:x.t,n:x.n}}).filter(x=>x.i>0&&x.i<pts.length-1).sort((a,b)=>a.i-b.i);fit(pts);nav()};
const nav=()=>{const el=$('nav');if(!route||!cur){el.hidden=1;return}el.hidden=0;
let b=1e9,bi=ri;const lo=Math.max(0,ri-5),hi=ri?Math.min(route.length,ri+150):route.length;
for(let i=lo;i<hi;i++){const d=hav(cur.p,route[i]);if(d<b){b=d;bi=i}}
if(b>80&&ri)for(let i=0;i<route.length;i++){const d=hav(cur.p,route[i]);if(d<b){b=d;bi=i}}
ri=bi;const left=cum[cum.length-1]-cum[ri],m=mans.find(x=>x.i>ri),set=(r,d,t,x)=>{$('ar').style.transform=`rotate(${r}deg)`;$('nd').textContent=d;$('nt').textContent=t;$('nx').textContent=x};
if(b>60)return set(0,fd(b),'Off route – head to the line',fd(left)+' left on route');
if(!m||left<25)return set(0,fd(left),'Arrive at destination','');
const m2=mans.find(x=>x.i>m.i),d=cum[m.i]-cum[ri];
const w=wps.find(x=>x.i>ri),sp=S.mov>60&&S.dist>300?S.dist/S.mov:cur.v>2?cur.v:0,et=x=>sp?' · ~'+fm(x/sp):'';set(m.t,fd(d),m.n||tx(m.t),(w?w.n+' in '+fd(cum[w.i]-cum[ri])+et(cum[w.i]-cum[ri])+' · ':'')+(m2?'Then '+(m2.n||tx(m2.t)).toLowerCase()+' in '+fd(cum[m2.i]-cum[m.i])+' · ':'')+fd(left)+' left'+et(left))};
const steps=()=>{if(!route)return toast('Import a GPX route first');$('sht').textContent='Directions';const T=cum[cum.length-1];
const it=mans.map(m=>({k:cum[m.i],i:m.i,t:m.n||tx(m.t)})).concat(wps.map(w=>({k:cum[w.i],i:w.i,t:'📍 '+w.n,s:1}))).sort((a,b)=>a.k-b.k);let prev=0,n=0;
const rows=[`<div class=tr><b>Start</b><span>${fd(T)} total · ${mans.length} turns${wps.length?' · '+wps.length+' stops':''}</span></div>`];
it.forEach(x=>{const d=x.k-prev;prev=x.k;rows.push(`<div class=tr data-i=${x.i}><b>${esc(x.s?x.t:++n+'. '+x.t)}</b><span>after ${fd(d)} · ${fd(x.k)} from start · ${fd(T-x.k)} to go</span></div>`)});
rows.push(`<div class=tr><b>Arrive at destination</b><span>${fd(T-prev)} after the last item</span></div>`);

const load=(p,w,ms,name)=>{if(p.length<2)return toast('No route found in file');wps=w;setRoute(p,ms);saveRoute(name||'Route');toast('Route: '+fd(cum[cum.length-1])+' · '+mans.length+' turns'+(wps.length?' · '+wps.length+' stops':''));steps()};
const cap=x=>x[0].toUpperCase()+x.slice(1);
const gm=async u=>{try{
if(/goo\.gl/.test(u))return toast("Short Google links can't be read. Open it in a browser and paste the long google.com/maps/dir/... address.");
const m=u.match(/\/dir\/([^?#]*)/);if(!m)return toast('Paste a google.com/maps/dir/... directions link');
const sg=[];for(const x of m[1].split('/')){if(!x||x[0]=='@'||x.startsWith('data='))break;sg.push(decodeURIComponent(x.replace(/\+/g,' ')))}
if(sg.length<2)return toast('Need a start and a destination');toast('Finding route…');const pt=[];
for(const x of sg){const c=x.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);if(c)pt.push([+c[1],+c[2]]);else{const g=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(x))).json();if(!g[0])return toast('Could not find "'+x+'"');pt.push([+g[0].lat,+g[0].lon])}}
const md=(u.match(/!3e(\d)/)||[])[1],pr=md==1?'bike':md==2?'foot':'car';
const j=await(await fetch(`https://routing.openstreetmap.de/routed-${pr}/route/v1/driving/${pt.map(c=>c[1]+','+c[0]).join(';')}?overview=full&geometries=geojson&steps=true`)).json();
const rt=j.routes&&j.routes[0];if(!rt)return toast('No route found');
const ms=rt.legs.flatMap(l=>l.steps).filter(s=>!/depart|arrive/.test(s.maneuver.type)&&(s.maneuver.modifier!='straight'||/roundabout|rotary/.test(s.maneuver.type))).map(s=>{const m=s.maneuver,o=m.modifier||'',t={'sharp left':-135,left:-90,'slight left':-45,'slight right':45,right:90,'sharp right':135,uturn:180}[o]||0,L=o=='left'||o=='right',on=s.name?' onto '+s.name:'';
return{p:[m.location[1],m.location[0]],t,n:/roundabout|rotary/.test(m.type)?'Roundabout, exit '+(m.exit||'')+on:(o=='uturn'?'Make a U-turn':(L?'Turn ':'')+cap(o||'continue'))+on}});
load(rt.geometry.coordinates.map(c=>[c[1],c[0],0,0]),sg.map((n,i)=>({p:pt[i],n:(i?i==sg.length-1?'Finish':'Stop '+i:'Start')+(/^-?\d/.test(n)?'':' - '+n.split(',')[0])})),ms,'Google: '+sg.map(x=>x.split(',')[0]).join(' > '))
}catch(e){toast('Could not load route (needs internet)')}};
$('gl').onclick=()=>{const u=prompt('Paste the Google Maps directions link');if(u)gm(u)};
$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;const d=new DOMParser().parseFromString(await f.text(),'text/xml'),nm=x=>x.getElementsByTagName('name')[0]?.textContent,fn=f.name.replace(/\.\w+$/,'');
if(d.getElementsByTagName('kml').length){const cs=x=>x.getElementsByTagName('coordinates')[0].textContent.trim().split(/\s+/).map(y=>y.split(',').map(Number));
load([...d.getElementsByTagName('LineString')].flatMap(l=>cs(l).map(c=>[c[1],c[0],0,0])),[...d.getElementsByTagName('Placemark')].filter(x=>x.getElementsByTagName('Point').length).map(x=>{const c=cs(x)[0];return{p:[c[1],c[0]],n:nm(x)||'Stop'}}),0,fn)}
else{const q=t=>[...d.getElementsByTagName(t)].map(x=>[+x.getAttribute('lat'),+x.getAttribute('lon'),0,0,nm(x)]);let p=q('trkpt');if(p.length<2)p=q('rtept');load(p,q('wpt').map(a=>({p:a,n:a[4]||'Stop'})),0,fn)}
e.target.value=''};
// ---------- trips, GPX export, Strava
const gpx=t=>`<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="GPS Speedo" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Trip ${new Date(t.id).toISOString().slice(0,16)}</name><trkseg>${t.pts.map(p=>`<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}">${p[3]!=null?`<ele>${(+p[3]).toFixed(1)}</ele>`:''}<time>${new Date(p[2]).toISOString()}</time></trkpt>`).join('')}</trkseg></trk></gpx>`;
const out=async(t,strava)=>{const f=new File([gpx(t)],`trip-${t.id}.gpx`,{type:'application/gpx+xml'});
if(strava&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Trip'});return}catch(e){if(e.name=='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();
if(strava){toast('GPX saved – choose it on Strava');setTimeout(()=>open('https://www.strava.com/upload/select'),1200)}};
const trips=async()=>{$('sht').textContent='Trips';const all=((await kv('r',s=>s.getAll()))||[]).filter(x=>x&&x.pts).sort((a,b)=>b.id-a.id),k=S.unit?2.23694:3.6;
$('tl').innerHTML=all.map(t=>`<div class=tr><b>${new Date(t.id).toLocaleString()}</b><span>${dk(t.dist)} · ${ft(t.el)} · avg ${t.mov>5?(t.dist/t.mov*k).toFixed(1):0} · max ${Math.round(t.max*k)} ${S.unit?'mph':'km/h'} · climb ${Math.round(t.gain||0)} m</span><button data-a=v data-i=${t.id}>Map</button><button data-a=g data-i=${t.id}>GPX</button><button data-a=s data-i=${t.id}>Strava</button><button data-a=d data-i=${t.id}>🗑</button></div>`).join('')||'<p style="opacity:.6">No trips yet – press START.</p>'};
$('tb').onclick=()=>{$('sh').classList.add('o');trips()};$('cl').onclick=()=>$('sh').classList.remove('o');
$('tl').onclick=async e=>{const b=e.target.closest('button');if(!b){const q=e.target.closest('.tr[data-i]');if(q&&route){const p=route[+q.dataset.i];C.lat=p[0];C.lon=p[1];C.z=18;follow=false;dirty=1;$('sh').classList.remove('o')}return}const id=+b.dataset.i,a=b.dataset.a;if(a=='rl'||a=='rd'){const k='r'+id;if(a=='rd'){if(confirm('Delete this route?')){await kv('w',s=>s.delete(k));routes()}}else{useRoute(await kv('r',s=>s.get(k)));$('sh').classList.remove('o')}return}const t=await kv('r',s=>s.get('t'+id));
if(a=='d'){if(confirm('Delete this trip?')){await kv('w',s=>s.delete('t'+id));trips()}}
else if(a=='v'){view=t.pts;fit(view);$('sh').classList.remove('o')}else out(t,a=='s')};
// ---------- menu
$('mb').onclick=()=>$('mn').classList.add('o');$('mx2').onclick=()=>$('mn').classList.remove('o');

// ---------- saved routes, stop editing, auto-pause, battery saver
const saveRoute=async name=>{rid=Date.now();localStorage.lr=rid;await kv('w',s=>s.put({id:rid,name,route,mans,wps,dist:cum[cum.length-1]},'r'+rid))};

const routes=async()=>{$('sht').textContent='Past routes';const all=((await kv('r',s=>s.getAll()))||[]).filter(x=>x&&x.route).sort((a,b)=>b.id-a.id);
$('tl').innerHTML=all.map(x=>`<div class=tr><b>${esc(x.name)}</b><span>${new Date(x.id).toLocaleDateString()} · ${(x.dist/1000).toFixed(1)} km · ${x.wps.length} stops</span><button data-a=rl data-i=${x.id}>Load</button><button data-a=rd data-i=${x.id}>🗑</button></div>`).join('')||'<p style="opacity:.6">No saved routes yet – import one.</p>';$('sh').classList.add('o')};

(async()=>{const id=+localStorage.lr;if(id){const q=await kv('r',s=>s.get('r'+id));if(q&&!route)useRoute(q)}})();
// ---------- boot
{const q=new URLSearchParams(location.search),m=((q.get('url')||'')+' '+(q.get('text')||'')).match(/https?:\/\/\S+/);if(m){history.replaceState(0,'',location.pathname);gm(m[0])}}
(async()=>{const c=await kv('r',s=>s.get('cur'));if(c&&c.pts&&c.pts.length>1){await kv('w',s=>s.put(c,'t'+c.id));await kv('w',s=>s.delete('cur'));toast('Recovered an unfinished trip')}})();
